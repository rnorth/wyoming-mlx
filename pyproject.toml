[project]
name = "wyoming-mlx"
version = "0.1.0"
description = "Apple-Silicon-native TTS and streaming STT for Home Assistant and OpenAI-compatible clients"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Richard North", email = "rich.north@gmail.com" }]
keywords = ["wyoming", "home-assistant", "mlx", "tts", "stt", "kokoro", "whisper", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.12"
dependencies = [
    "wyoming",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "scipy",
    "soundfile",
    "python-multipart>=0.0.29",
    # mlx comes in transitively via whisperlivekit[mlx-whisper] → mlx-whisper.
    "whisperlivekit[mlx-whisper]==0.2.22; sys_platform == 'darwin'",
    "kokoro>=0.9.4",
    "torch",
]

[project.urls]
Homepage = "https://github.com/rnorth/wyoming-mlx"
Issues = "https://github.com/rnorth/wyoming-mlx/issues"

[project.scripts]
wyoming-mlx = "wyoming_mlx.__main__:main"

[tool.uv.sources]
# CPU-only torch on Linux (no CUDA downloads in CI); Metal-enabled PyPI wheels on macOS.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wyoming_mlx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring real MLX models (auto-skipped, use --integration to run)",
]
testpaths = ["tests"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[[tool.pyright.executionEnvironments]]
# Tests may exercise private helpers directly.
root = "tests"
reportPrivateUsage = "none"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W", "A", "C4", "N", "PT", "PTH"]

[tool.coverage.run]
source = ["src/wyoming_mlx"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Real MLX backends and server wiring are only exercised by --integration
# runs on Apple Silicon, which CI (Linux) cannot do.
fail_under = 70

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.14",
]
